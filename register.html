<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Registrarse - Feria de Universidades</title>
  <link rel="stylesheet" href="css/bootstrap.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .register-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      padding: 30px;
      width: 100%;
      max-width: 500px;
      margin: auto;
    }
    .register-card h3 {
      color: #3a0ca3;
      font-weight: 700;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px;
    }
    .btn-success {
      border-radius: 25px;
      padding: 12px;
      font-weight: 600;
    }
    .btn-secondary {
      border-radius: 25px;
      padding: 10px;
      margin-top: 10px;
    }
    .footer_section {
      background: transparent;
      color: #fff;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <section>
    <div class="register-card">
      <h3 class="text-center mb-4">Crear Cuenta</h3>
      <form action="register.php" method="POST">
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Tu nombre completo" required>
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Tu correo" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Crea una contraseña" required>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirmar contraseña</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repite tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-success btn-block">Registrarse</button>
      </form>
      <p class="text-center mt-3">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
      <a href="index.html" class="btn btn-secondary btn-block">Volver a la página principal</a>
    </div>
  </section>
  <footer class="footer_section text-center py-3">
    <p>© 2025 Feria de Universidades</p>
  </footer>
</body>
</html>
