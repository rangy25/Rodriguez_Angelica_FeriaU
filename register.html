<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuario - Feria de Universidades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.css">
  <style>
    body {
      background: linear-gradient(135deg, #3a0ca3, #4361ee);
      font-family: Arial, sans-serif;
    }
    .registro-card {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .registro-card h2 {
      color: #3a0ca3;
      font-weight: 700;
      margin-bottom: 25px;
      text-align: center;
    }
    .btn-custom {
      border-radius: 25px;
      font-weight: bold;
      padding: 10px;
    }
    .form-group label {
      font-weight: 600;
      color: #333;
    }
    .link-login {
      display: block;
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="registro-card">
    <h2>📝 Registro de Usuario</h2>
    <form action="register.php" method="POST">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select name="rol" class="form-control" required>
          <option value="Usuario" selected>Usuario</option>
          <option value="Administrador">Administrador</option>
          <option value="Delegado">Delegado</option>
          <option value="Apoyo">Apoyo</option>
          <option value="Guía">Guía</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-custom">Registrar</button>
      <a href="login.html" class="link-login">¿Ya tienes cuenta? Inicia sesión aquí</a>
    </form>
    <!-- Botón volver al inicio -->
    <a href="index.php" class="btn btn-secondary btn-block btn-custom mt-3">⬅️ Volver al inicio</a>
  </div>

</body>
</html>
