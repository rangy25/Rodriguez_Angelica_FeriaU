<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar Sesión - Feria de Universidades</title>
  <link rel="stylesheet" href="css/bootstrap.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <style>
    /* Fondo degradado */
    body {
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* Caja de login */
    .login-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      padding: 30px;
      width: 100%;
      max-width: 400px;
      margin: auto;
    }
    .login-card h3 {
      color: #3a0ca3;
      font-weight: 700;
    }
    /* Inputs */
    .form-control {
      border-radius: 10px;
      padding: 12px;
    }
    /* Botones */
    .btn-primary {
      border-radius: 25px;
      padding: 12px;
      font-weight: 600;
      background: #4361ee;
      border: none;
    }
    .btn-primary:hover {
      background: #3a0ca3;
    }
    .btn-secondary {
      border-radius: 25px;
      padding: 10px;
      margin-top: 10px;
    }
    /* Footer */
    .footer_section {
      background: transparent;
      color: #fff;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <!-- Encabezado reducido -->
  <header class="header_section">
    <div class="container text-center py-3">
      <a class="navbar-brand d-flex align-items-center justify-content-center" href="index.html">
        <span style="color:white;">Feria de Universidades</span>
      </a>
    </div>
  </header>

  <!-- Formulario de login -->
  <section>
    <div class="login-card">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
      <form action="login.php" method="POST">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Ingresa tu correo" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
      <p class="text-center mt-3">
        ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
      </p>
      <a href="index.html" class="btn btn-secondary btn-block">🏠 Volver a la página principal</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer_section text-center py-3">
    <p>© 2025 Feria de Universidades</p>
  </footer>
</body>
</html>
